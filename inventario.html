<script>

const buscar =
    document.getElementById("buscar");

buscar.addEventListener(
    "keyup",
    function() {

        const filtro =
            this.value.toLowerCase();

        document
            .querySelectorAll(
                "#tabla tbody tr"
            )
            .forEach(fila => {

                fila.style.display =
                    fila.textContent
                    .toLowerCase()
                    .includes(filtro)
                    ? ""
                    : "none";

            });

    }
);

let columnaActual = -1;
let ascendente = true;

function ordenarTabla(columna)
{
    const tbody =
        document.querySelector(
            "#tabla tbody"
        );

    const filas =
        Array.from(
            tbody.querySelectorAll("tr")
        );

    if (columnaActual === columna)
    {
        ascendente = !ascendente;
    }
    else
    {
        columnaActual = columna;
        ascendente = true;
    }

    filas.sort((a, b) => {

        let aVal =
            a.cells[columna]
            .innerText
            .trim();

        let bVal =
            b.cells[columna]
            .innerText
            .trim();

        const aNum =
            parseFloat(
                aVal.replace(/\./g, "")
            );

        const bNum =
            parseFloat(
                bVal.replace(/\./g, "")
            );

        if (
            !isNaN(aNum)
            &&
            !isNaN(bNum)
        )
        {
            return ascendente
                ? aNum - bNum
                : bNum - aNum;
        }

        return ascendente
            ? aVal.localeCompare(
                bVal,
                undefined,
                {numeric:true}
            )
            : bVal.localeCompare(
                aVal,
                undefined,
                {numeric:true}
            );

    });

    tbody.innerHTML = "";

    filas.forEach(
        fila =>
        tbody.appendChild(fila)
    );

    actualizarNumeracion();
}

function actualizarNumeracion()
{
    document
        .querySelectorAll("#tabla tbody tr")
        .forEach((fila, indice) => {

            fila.cells[0].innerText =
                indice + 1;

        });
}

</script>
